# Copy this file verbatim to .github/workflows/ci.yml using the GitHub editor.
name: CI checks

on:
  push:
    branches: [main]

permissions:
  contents: read

# New commits can replace checks. Production releases use a separate group.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.repository == 'giorgioinfo13/tech-news-radar' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.txt
          npm ci --prefix frontend
      - name: Backend checks with temporary SQLite databases
        working-directory: backend
        run: |
          ruff check . ../scripts/release_render.py
          ruff format --check . ../scripts/release_render.py
          pytest -q
      - name: Backend checks with temporary PostgreSQL databases
        working-directory: backend
        env:
          TNR_TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci-test-only@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          python -c "import psycopg; c = psycopg.connect('postgresql://postgres:ci-test-only@127.0.0.1:5432/postgres', autocommit=True); c.execute('CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role BYPASSRLS'); c.close()"
          pytest --postgres -q
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run format:check
          npm run build
