[project]
name = "tech-news-radar-backend"
version = "0.1.0"
license = "MIT"
description = "Local API for Tech News Radar"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "defusedxml>=0.7.1,<1",
    "fastapi>=0.115,<1",
    "feedparser>=6.0,<7",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
